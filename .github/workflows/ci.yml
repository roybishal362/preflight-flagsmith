name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # Dogfood: the demo page must never ship an experiment that records nothing.
      - name: Preflight lint on our own demo page
        uses: ./
        with:
          path: web
          events: demo_button_clicked
